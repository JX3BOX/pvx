name: Deploy CDN Files
on:
    push:
        branches:
            - master
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        strategy:
            matrix:
                node-version: [v22.14.0]
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install && Build
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.JX3BOX_PACKAGES_READ_TOKEN || github.token }}
              run: |
                  echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$HOME/.npmrc"
                  EXTERIOR_VER=$(node -p "require('./package.json').dependencies['@jx3box/jx3box-exterior']")
                  npm pkg delete dependencies.@jx3box/jx3box-exterior
                  npm install --no-audit --no-fund
                  npm install --no-save --@jx3box:registry=https://npm.pkg.github.com "@jx3box/jx3box-exterior@${EXTERIOR_VER}"
                  npm run build

            - name: Github Pages
              uses: JamesIves/github-pages-deploy-action@releases/v3
              with:
                  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
                  BRANCH: gh-pages
                  FOLDER: dist
                  CLEAN: true

            ## TODO:下方修改两处
            - name: OSS
              uses: manyuanrong/setup-ossutil@v2.0
              with:
                  endpoint: "oss-cn-hangzhou.aliyuncs.com"
                  access-key-id: ${{secrets.AccessKey_ID}}
                  access-key-secret: ${{secrets.Access_Key_Secret}}
            - run: ossutil cp -rf dist oss://jx3box/static/pvx
            #- run: ossutil cp -rf dist oss://jx3box-www/bbs
